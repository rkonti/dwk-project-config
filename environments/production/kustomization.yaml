apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
  # Only production is backed up
resources:
- ../base
- backup-persistentvolumeclaim.yaml
- backup-cronjob.yaml
patches:
- path: configmap.yaml
# Every tag in rkonti/DevOps-with-Kubernetes: its release workflow sets these
# to that tag's images
images:
- name: PROJECT/BROADCASTER
  newName: ghcr.io/rkonti/broadcaster
  newTag: "4.10"
- name: PROJECT/TODO-APP
  newName: ghcr.io/rkonti/todo-app
  newTag: "4.10"
- name: PROJECT/TODO-BACKEND
  newName: ghcr.io/rkonti/todo-backend
  newTag: "4.10"
