apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
- ../base
  # Production keeps localhost:8081, staging is served at staging.localhost:8081
patches:
- path: configmap.yaml
- path: broadcaster.yaml
- patch: |-
    - op: add
      path: /spec/rules/0/host
      value: staging.localhost
  target:
    kind: Ingress
    name: todo-app-ingress
# Every commit to main in rkonti/DevOps-with-Kubernetes: its release workflow
# sets these to that commit's images
images:
- name: PROJECT/BROADCASTER
  newName: ghcr.io/rkonti/broadcaster
  newTag: 4e56be89c375273e31a19bd9bb4d2281a072d574
- name: PROJECT/TODO-APP
  newName: ghcr.io/rkonti/todo-app
  newTag: 4e56be89c375273e31a19bd9bb4d2281a072d574
- name: PROJECT/TODO-BACKEND
  newName: ghcr.io/rkonti/todo-backend
  newTag: 4e56be89c375273e31a19bd9bb4d2281a072d574
